<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Queue</title>
  <style>
    header { background: teal; padding: 12px; }
    header h1 { color: white; margin: 0; }
  </style>
</head>
<body>
  <header><h1>Stationery</h1></header>
    <p id="status">Nobody is waiting yet.</p>

  <table>
    <thead><tr><th>Name</th><th>Minutes</th><th>Bay</th></tr></thead>
    <tbody></tbody>
  </table>

    <form id="wait" novalidate>
    <input type="text" id="who" name="who" placeholder="Name">
    <input type="text" id="mins" name="mins" placeholder="Minutes">
    <select id="bay" name="bay">
      <option>Bay 1</option>
      <option>Bay 2</option>
    </select>
    <button type="submit" id="join">Join</button>
    <button type="button" id="call">Call next</button>
  </form>

  <p>Waiting: <span id="waiting">0</span></p>
  <p>Longest: <span id="longest">0</span></p>
  <footer>247243</footer>

  <script>
    const form = document.querySelector("#wait");
    const joinBtn = document.querySelector("#join");
    const callBtn = document.querySelector("#call");

    const statusLine = document.querySelector("#status");
    const minsBox = document.querySelector("#mins");

    if (!joinBtn || !callBtn) throw new Error("button missing");

    let rows = [];

    function draw() {
      const body = document.querySelector("tbody");
      body.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr");
        for (const v of [r.name, r.mins, r.bay]) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        }
        body.appendChild(tr);
      }
      const nums = rows.map(r => r.mins).filter(Number.isFinite);
      document.querySelector("#waiting").textContent = rows.length;
      document.querySelector("#longest").textContent = nums.length ? Math.max(...nums) : 0;
    }

            function onJoin(event) {
      event.preventDefault();
      const fd = new FormData(form);
      const name = fd.get("who");
      const bay = fd.get("bay");
      const raw = fd.get("mins");

      if (name === null || name.trim() === "") {
        statusLine.textContent = "undefined";
        return;
      }

      const mins = Number(raw);
      if (raw === null || raw.trim() === "" || Number.isNaN(mins)) {
        minsBox.setCustomValidity("not a number");
        minsBox.reportValidity();
        return;
      }
      minsBox.setCustomValidity("");

      const clean = name.trim();
      const found = rows.find(r => r.name === clean && r.bay === bay);
      if (found) found.mins += mins;
      else rows.push({ name: clean, mins: mins, bay: bay });

      document.querySelector("#who").value = "";
      document.querySelector("#mins").value = "";
      draw();
    }

        function onCall() {
      let best = -1;
      for (let i = 0; i < rows.length; i++) {
        if (Number.isFinite(rows[i].mins) &&
            (best === -1 || rows[i].mins >= rows[best].mins)) best = i;
      }
      if (best !== -1) rows.splice(best, 1);
      draw();
    }

    form.addEventListener("submit", onJoin);
    callBtn.addEventListener("click", onCall);
  </script>
</body>
</html>
